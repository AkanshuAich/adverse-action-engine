name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref; the latest push is the one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LINK_MODE: copy

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Without this the cache key matches nothing and never invalidates.
          cache-dependency-glob: "pyproject.toml"

      - name: Create the environment
        # An explicit venv rather than `--system`: `uv python install` provisions
        # a managed interpreter that `uv pip install --system` does not resolve
        # to, which failed the install outright. `uv venv` plus `uv run` pins
        # exactly one environment for every subsequent step.
        run: uv venv --python 3.12

      - name: Install dependencies
        # The ml extras are required, not optional: mypy type-checks
        # src/aae/ml and src/aae/data, and the unit tests exercise the model
        # pipeline. Installing only [dev] fails at import.
        run: uv pip install -e ".[dev,ml]"

      - name: Ruff lint
        run: uv run ruff check . --output-format github

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy

      - name: Unit tests with coverage
        run: |
          uv run pytest tests/unit \
            --cov=src/aae \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Verifier coverage floor
        # The verifier is the core claim of this project, so it is held to a
        # higher bar than the rest of the codebase. Skipped until it exists.
        run: |
          if [ -n "$(find src/aae/verification -name '*.py' -not -name '__init__.py' -print -quit)" ]; then
            uv run pytest tests/unit \
              --cov=src/aae/verification \
              --cov-report=term-missing \
              --cov-fail-under=95
          else
            echo "Verifier not implemented yet (week 4); skipping its coverage gate."
          fi

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create the environment
        run: uv venv --python 3.12

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Integration tests
        # Testcontainers starts a real Postgres; the runner provides Docker.
        run: uv run pytest tests/integration -m integration

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the tip.
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create the environment
        run: uv venv --python 3.12

      - name: Dependency vulnerability audit
        run: |
          uv pip install -e "." pip-audit
          uv run pip-audit --strict

      - name: Static analysis (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python r/python.lang.security
