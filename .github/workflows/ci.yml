name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref; the latest push is the one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LINK_MODE: copy

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Without this the cache key matches nothing and never invalidates.
          cache-dependency-glob: "pyproject.toml"

      - name: Create the environment
        # An explicit venv rather than `--system`: `uv python install` provisions
        # a managed interpreter that `uv pip install --system` does not resolve
        # to, which failed the install outright. `uv venv` plus `uv run` pins
        # exactly one environment for every subsequent step.
        run: uv venv --python 3.12

      - name: Install dependencies
        # Every extra is required, not optional. mypy type-checks the whole
        # package, and the test suites exercise the model pipeline, the
        # generation graph and the retrieval store. Installing a subset fails
        # at import - which is how [ai] came to be missing here in the first
        # place, and why mypy passed locally while failing in CI.
        run: uv pip install -e ".[dev,ml,ai]"

      - name: Ruff lint
        run: uv run ruff check . --output-format github

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy

      - name: Tests with coverage
        # Unit and integration run together, in one job, against one coverage
        # number. Splitting them was measuring the wrong thing: the API and the
        # audit repository are exercised by the integration suite, so gating on
        # unit-only coverage reported 73% for a codebase at 94% and would have
        # pushed toward either a meaningless threshold or tests written to move
        # a number. The runner provides Docker, so Testcontainers works here.
        run: |
          uv run pytest \
            --cov=src/aae \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Verifier coverage floor
        # The verifier is the core claim of this project, so it is held to a
        # higher bar than the rest of the codebase. Skipped until it exists.
        run: |
          if [ -n "$(find src/aae/verification -name '*.py' -not -name '__init__.py' -print -quit)" ]; then
            uv run pytest tests/unit \
              --cov=src/aae/verification \
              --cov-report=term-missing \
              --cov-fail-under=95
          else
            echo "Verifier not implemented yet (week 4); skipping its coverage gate."
          fi

      - name: Evaluation gate
        # Runs the golden set against a simulated provider with a fixed,
        # deliberately pessimistic failure distribution.
        #
        # This measures how the SYSTEM handles model mistakes - whether the
        # verifier catches them and whether the repair prompt is specific
        # enough to fix them. It does not measure how good any real model is.
        # Those are different questions, and the headline figures for a live
        # backend come from running the same harness manually against one.
        #
        # The gate fails on a regression against the committed baseline, and
        # unconditionally if a prohibited reference reaches an issued notice.
        run: uv run python -m evals.runner --provider simulated --no-report

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the tip.
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create the environment
        run: uv venv --python 3.12

      - name: Dependency vulnerability audit
        # Audits the declared dependency set, not the installed environment.
        # `pip-audit --strict` fails on any distribution it cannot resolve on
        # PyPI, and this project is installed editable and unpublished, so
        # auditing the environment always failed on our own package rather
        # than on a real finding. `--skip-editable` does not help: strict mode
        # treats a skipped package as a failure too.
        run: |
          uv pip compile pyproject.toml --extra dev --extra ml --extra ai -o /tmp/requirements.txt
          uv pip install pip-audit
          uv run pip-audit -r /tmp/requirements.txt --strict

      - name: Static analysis (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python r/python.lang.security
