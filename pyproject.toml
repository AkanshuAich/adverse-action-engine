[project]
name = "adverse-action-engine"
version = "0.1.0"
description = "Verifiable adverse action notices for credit decisions"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "structlog>=24.4",
    "httpx>=0.28",
]

[project.optional-dependencies]
ml = [
    "pandas>=2.2",
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    "mlflow>=2.18",
    "pandera>=0.21",
    "fairlearn>=0.11",
    # evidently (drift monitoring, week 7) is deliberately not here yet.
    # It pulls nltk transitively, which currently carries PYSEC-2026-3740
    # with no fix released. Carrying a vulnerable dependency five weeks
    # before it is used buys nothing, so it is added when week 7 needs it
    # and the advisory is re-checked then.
]
ai = [
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "fastembed>=0.4",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "textstat>=0.7",
]
console = [
    "streamlit>=1.40",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.119",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aae"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes
    "T20",       # no print()
    "SIM",       # simplify
    "PTH",       # use pathlib
    "RUF",       # ruff-specific
    "ANN",       # type annotations
    "D",         # docstrings
    "S",         # bandit security
    "ASYNC",     # async correctness
]
ignore = [
    "D203",      # conflicts with D211
    "D213",      # conflicts with D212
    "ANN401",    # allow Any in narrow internal spots, flagged by mypy anyway
]

[tool.ruff.lint.per-file-ignores]
# Test names are the documentation; assert is the point of a test file.
"tests/**" = ["S101", "D100", "D101", "D102", "D103", "ANN001", "ANN201", "ANN202"]
"evals/**" = ["T201"]
"alembic/**" = ["D103", "D100", "ANN201", "INP001"]
"src/aae/console/**" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_explicit = false
show_error_codes = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["aae"]

[[tool.mypy.overrides]]
module = [
    "shap.*", "xgboost.*", "sklearn.*", "onnxmltools.*", "skl2onnx.*",
    "mlflow.*", "fairlearn.*", "evidently.*", "presidio_analyzer.*",
    "presidio_anonymizer.*", "fastembed.*", "textstat.*", "pgvector.*",
    "testcontainers.*", "streamlit.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: requires Docker (Testcontainers)",
]

[tool.coverage.run]
source = ["src/aae"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
